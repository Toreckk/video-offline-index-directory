name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and shared application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm verify:version
      - run: pnpm verify:docs
      - run: pnpm test:release
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build:web

  desktop:
    name: Desktop native checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop-ui
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - run: pnpm inventory:dependencies
      - run: pnpm notices:check
      - run: pnpm test:release:native
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Probe synthetic real media with a verified test helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ffmpeg | Out-Null
          # Month-end builds are retained for two years; ordinary daily builds expire after 14 builds.
          # Reassess this pin at dependency reviews and before August 2028.
          curl.exe --silent --show-error --location --fail --retry 3 --max-time 300 https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/ffmpeg-n9.0.1-11-ge47273f4d9-win64-lgpl-shared-9.0.zip --output artifacts/ffmpeg/tool.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the test helper' }
          if ((Get-FileHash artifacts/ffmpeg/tool.zip -Algorithm SHA256).Hash -ne '83a824f0729a69d143c9865125bb86988a11dd388325f0033711045522068aa0') { throw 'Test-helper checksum mismatch' }
          Expand-Archive artifacts/ffmpeg/tool.zip -DestinationPath artifacts/ffmpeg -Force
          $probe = Get-ChildItem artifacts/ffmpeg -Filter ffprobe.exe -Recurse -File | Select-Object -First 1
          if (-not $probe) { throw 'Test helper does not contain ffprobe.exe' }
          $env:VOID_FFPROBE_PATH = $probe.FullName
          $env:VOID_MEDIA_PROBE_FIXTURE = Join-Path $PWD 'fixtures/media'
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib benchmarks_a_configured_media_corpus -- --ignored --nocapture

  candidate:
    name: Release branch installers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [web, desktop]
    uses: ./.github/workflows/windows-package.yml
