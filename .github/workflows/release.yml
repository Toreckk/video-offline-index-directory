name: Publish release

on:
  push:
    branches: [master]
    paths: [release-manifest.json]

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'Toreckk/video-offline-index-directory' }}
    uses: ./.github/workflows/windows-package.yml
    with:
      finalized: true

  publish:
    name: Publish verified Windows artifacts
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: release-assets
      - name: Verify and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
