name: Publish release

on:
  push:
    branches:
      - master
    paths:
      - release-manifest.json

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish-windows:
    name: Build and publish Windows release
    if: ${{ github.repository == 'Toreckk/video-offline-index-directory' }}
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:version
      - name: Resolve release metadata
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json | ConvertFrom-Json
          if (-not $manifest.publish) { throw 'release-manifest.json does not authorize publication' }
          "VOID_RELEASE_VERSION=$($manifest.version)" >> $env:GITHUB_ENV
          "VOID_RELEASE_TAG=v$($manifest.version)" >> $env:GITHUB_ENV
          "VOID_RELEASE_NOTES=$($manifest.notes)" >> $env:GITHUB_ENV
      - name: Ensure version is unpublished
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = gh release view $env:VOID_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) { throw "Release $env:VOID_RELEASE_TAG is already published" }
            if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw "Existing draft targets a different commit" }
            "VOID_RELEASE_EXISTS=true" >> $env:GITHUB_ENV
          } else {
            git rev-parse --verify --quiet "refs/tags/$env:VOID_RELEASE_TAG"
            if ($LASTEXITCODE -eq 0) { throw "Tag $env:VOID_RELEASE_TAG exists without a resumable draft" }
            "VOID_RELEASE_EXISTS=false" >> $env:GITHUB_ENV
          }
          $global:LASTEXITCODE = 0
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build:web
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm build:desktop
      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $bundles = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($bundles.Count -ne 2) { throw "Expected one NSIS and one MSI installer; found $($bundles.Count)" }
          Copy-Item $bundles.FullName release-assets
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VOID_RELEASE_EXISTS -ne 'true') {
            gh release create $env:VOID_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VOID $env:VOID_RELEASE_TAG" --notes-file $env:VOID_RELEASE_NOTES --draft
            if ($LASTEXITCODE -ne 0) { throw "Failed to create the draft release" }
          }
          Get-ChildItem release-assets -File | ForEach-Object {
            gh release upload $env:VOID_RELEASE_TAG $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($_.Name)" }
          }
          gh release edit $env:VOID_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false
