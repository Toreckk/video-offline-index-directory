name: Package Windows candidate

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      finalized:
        description: Require publication authorization and finalized changelog
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Validate and package Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check publication readiness
        if: ${{ inputs.finalized == true }}
        run: pnpm verify:version --finalized
      - run: pnpm check:native
      - run: pnpm build:desktop -- --locked
      - name: Collect installers and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content release-manifest.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $bundles = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($bundles.Count -ne 2 -or @($bundles | Where-Object Extension -eq '.exe').Count -ne 1 -or @($bundles | Where-Object Extension -eq '.msi').Count -ne 1) {
            throw 'Expected exactly one NSIS and one MSI installer'
          }
          Copy-Item $bundles.FullName release-assets
          $bundles | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8
          Copy-Item $manifest.notes release-assets/RELEASE_NOTES.md
          Copy-Item THIRD_PARTY_NOTICES.txt release-assets/THIRD_PARTY_NOTICES.txt
          @{
            version = $manifest.version
            commit = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            node = (node --version)
            pnpm = (pnpm --version)
            rust = (rustc --version)
          } | ConvertTo-Json | Set-Content release-assets/build-info.json -Encoding utf8
          "### Windows candidate: v$($manifest.version)" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA. Unsigned NSIS/MSI; manual QA is still required." >> $env:GITHUB_STEP_SUMMARY
          Get-Content release-assets/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY
          "Download the artifact below, then run: pnpm release:inspect <extracted-folder> $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "For the final master build, Publish release inputs: build_run_id=$env:GITHUB_RUN_ID; expected_sha=$env:GITHUB_SHA. Dispatch only after installed smoke QA." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
