[package]
name = "void-desktop"
version = "0.4.0"
license = "MIT"
description = "VOID — Video Offline Index Directory"
authors = ["VOID contributors"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "void_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8.2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
trash = "5.2.6"
walkdir = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
windows = { version = "0.56", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
